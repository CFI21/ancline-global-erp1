name: ANCLINE Live Role UAT

on:
  workflow_dispatch:

# Single-System Live Review Mode: manual-only.
# smart-release.yml is the only automatic staging build/deploy/regression owner.

permissions:
  contents: read

jobs:
  live-role-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEB_URL: https://ancline-web-live.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run live role-by-role UI/UAT
        run: node tools/live_role_uat.mjs
