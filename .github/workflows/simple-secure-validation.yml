name: ANCLINE Simple Secure Validation

on:
  workflow_dispatch:

# Single-System Live Review Mode: manual-only.
# smart-release.yml is the only automatic staging build/deploy/regression owner.

permissions:
  contents: write

concurrency:
  group: ancline-simple-secure-validation
  cancel-in-progress: true

env:
  API_URL: https://ancline-api-staging.onrender.com
  WEB_URL: https://ancline-web-live.onrender.com
  POSTGRES_ID: dpg-daiois8jo6nc73foblng-a
  REDIS_ID: red-daipbggae00c73fed9h0

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate single Render resources
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${RENDER_API_KEY:?RENDER_API_KEY required}"
          curl -fsS -H "Accept: application/json" -H "Authorization: Bearer $RENDER_API_KEY"             "https://api.render.com/v1/postgres/$POSTGRES_ID" -o /tmp/pg.json
          curl -fsS -H "Accept: application/json" -H "Authorization: Bearer $RENDER_API_KEY"             "https://api.render.com/v1/key-value/$REDIS_ID" -o /tmp/redis.json

          jq -e '(.id // .postgres.id) == env.POSTGRES_ID' /tmp/pg.json >/dev/null
          jq -e '(.id // .keyValue.id) == env.REDIS_ID' /tmp/redis.json >/dev/null
          [[ "$(jq -r '.status // .postgres.status // empty' /tmp/pg.json)" == "available" ]]
          [[ "$(jq -r '.status // .keyValue.status // empty' /tmp/redis.json)" == "available" ]]
          [[ "$(jq -r '.options.maxmemoryPolicy // .keyValue.options.maxmemoryPolicy // empty' /tmp/redis.json)" == "noeviction" ]]
          echo "Single Render Postgres + Redis hardening PASS."

      - name: Wait for approved API runtime and backup evidence
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            h="$(curl -L -sS -o /tmp/health.json -w '%{http_code}' --connect-timeout 10 --max-time 25 "$API_URL/api/health" || true)"
            e="$(curl -L -sS -o /tmp/evidence.json -w '%{http_code}' --connect-timeout 10 --max-time 25 "$API_URL/api/release/evidence" || true)"
            if [[ "$h" == "200" && "$e" == "200" ]] &&
               jq -e '.status=="online" and .service=="ANCLINE API"' /tmp/health.json >/dev/null &&
               jq -e '.ready==true and .uat.status=="PASS" and .backup.status=="PASS"' /tmp/evidence.json >/dev/null; then
              break
            fi
            [[ "$i" == "60" ]] && { echo "::error::Approved API runtime/backup evidence not ready"; exit 1; }
            sleep 10
          done
          jq -r '.backup.sha256 // .backup.ciphertextSha256 // empty' /tmp/evidence.json > /tmp/backup-sha
          echo "Existing encrypted backup evidence PASS."

      - name: Authenticate controlled UAT admin
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -L -sS -o /tmp/login.json -w '%{http_code}' --connect-timeout 10 --max-time 30             -H 'Content-Type: application/json'             -d '{"email":"test.admin@ancline.invalid","role":"GLOBAL_ADMIN"}'             "$API_URL/api/auth/login")"
          [[ "$code" == "200" || "$code" == "201" ]] || { echo "::error::Controlled UAT login unavailable"; exit 1; }
          token="$(jq -r '.accessToken // empty' /tmp/login.json)"
          [[ -n "$token" ]] || { echo "::error::Controlled UAT token missing"; exit 1; }
          echo "::add-mask::$token"
          {
            echo "UAT_TOKEN<<EOF"
            echo "$token"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Run secure in-runtime database restore drill
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            code="$(curl -L -sS -o /tmp/restore.json -w '%{http_code}' --connect-timeout 10 --max-time 120               -X POST -H "Authorization: Bearer $UAT_TOKEN"               "$API_URL/api/uat/database-restore-drill" || true)"
            if [[ "$code" == "200" || "$code" == "201" ]]; then
              jq -e '.status=="PASS" and .destructive==false and .tableCount>0 and .sourceFingerprint==.restoredFingerprint' /tmp/restore.json >/dev/null
              break
            fi
            [[ "$i" == "40" ]] && { echo "::error::Secure restore drill endpoint did not pass"; cat /tmp/restore.json 2>/dev/null || true; exit 1; }
            sleep 10
          done
          jq -r '.restoredFingerprint' /tmp/restore.json > /tmp/restore-fingerprint
          jq -r '.tableCount' /tmp/restore.json > /tmp/restore-table-count
          echo "Isolated in-runtime restore drill PASS."

      - name: Run full ECOM UAT
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -L -sS -o /tmp/uat.json -w '%{http_code}' --connect-timeout 10 --max-time 180             -X POST -H "Authorization: Bearer $UAT_TOKEN" -H 'Content-Type: application/json'             -d '{"cleanup":true}' "$API_URL/api/uat/run")"
          [[ "$code" == "200" || "$code" == "201" ]] || { cat /tmp/uat.json; exit 1; }
          jq -e '.status=="PASS" and .summary.failed==0 and .summary.total>=20 and .summary.passed==.summary.total' /tmp/uat.json >/dev/null
          jq -r '.runId' /tmp/uat.json > /tmp/uat-run-id
          echo "Full ECOM transactional UAT PASS."

      - name: Validate Web/API security posture
        shell: bash
        run: |
          set -euo pipefail
          curl -L -fsS --connect-timeout 10 --max-time 30 "$WEB_URL/release-info" -o /tmp/web.json
          curl -L -fsS --connect-timeout 10 --max-time 30 "$WEB_URL/api-proxy/health" -o /tmp/proxy.json
          jq -e '.status=="online" and .service=="ANCLINE Web"' /tmp/web.json >/dev/null
          jq -e '.status=="online" and .service=="ANCLINE API"' /tmp/proxy.json >/dev/null

          hdr="$(mktemp)"
          curl -L -sS -D "$hdr" -o /dev/null --connect-timeout 10 --max-time 30 "$WEB_URL/login"
          grep -Eqi '^x-content-type-options:[[:space:]]*nosniff' "$hdr"
          grep -Eqi '^x-frame-options:|^content-security-policy:' "$hdr"

          anon="$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 "$API_URL/api/uat/status" || true)"
          [[ "$anon" == "401" || "$anon" == "403" ]] || { echo "::error::UAT endpoint anonymous protection failed HTTP $anon"; exit 1; }
          echo "Runtime security posture PASS."

      - name: Write simple-secure evidence
        shell: bash
        run: |
          set -euo pipefail
          tested="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          backup_sha="$(cat /tmp/backup-sha)"
          restore_fp="$(cat /tmp/restore-fingerprint)"
          table_count="$(cat /tmp/restore-table-count)"
          uat_run="$(cat /tmp/uat-run-id)"

          cat > infra/go-live/restore-drill.json <<JSON
          {
            "schema": "ANCLINE_RESTORE_DRILL_V2",
            "status": "PASS",
            "testedAt": "$tested",
            "backupSha256": "$backup_sha",
            "target": "temporary isolated schema inside existing Render Postgres",
            "method": "authenticated in-runtime logical restore drill",
            "restoredFingerprint": "$restore_fp",
            "restoredTableCount": $table_count,
            "productionRowsDestructivelyModified": false
          }
          JSON

          cat > infra/go-live/simple-secure-mode.json <<JSON
          {
            "schema": "ANCLINE_SIMPLE_SECURE_MODE_V2",
            "status": "PASS",
            "testedAt": "$tested",
            "architecture": "single Render stack",
            "webService": "ancline-web-live",
            "apiService": "ancline-api-staging",
            "postgres": "ancline-staging-postgres",
            "redis": "ancline-staging-redis",
            "approvedImagesPreserved": true,
            "externalDatabaseProviders": false,
            "paidInfrastructureRequired": false,
            "databasePublicExposureAdded": false,
            "backupEvidence": "PASS",
            "backupRestoreDrill": "PASS",
            "fullEcomUat": "PASS",
            "uatRunId": "$uat_run",
            "runtimeSecurity": "PASS",
            "redisPolicy": "noeviction",
            "supersededDedicatedProdServicesUsed": false
          }
          JSON

          git config user.name github-actions
          git config user.email github-actions@github.com
          git add infra/go-live/restore-drill.json infra/go-live/simple-secure-mode.json
          git diff --cached --quiet || {
            git commit -m "Record simple secure single-stack validation evidence"
            git push
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ancline-simple-secure-evidence-${{ github.run_id }}
          path: |
            infra/go-live/restore-drill.json
            infra/go-live/simple-secure-mode.json
          retention-days: 90

# manual-simple-secure-validation-trigger: 2026-09-22T20:29Z
