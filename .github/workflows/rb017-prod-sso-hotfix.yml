name: RB-017 Production SSO Hotfix

on:
  push:
    branches: [rb017-prod-sso-hotfix]
    paths:
      - 'apps/web/**'
      - '.github/workflows/rb017-prod-sso-hotfix.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      IMAGE: ghcr.io/cfi21/ancline-web
      PROD_WEB_SERVICE_ID: srv-dapdotijnfac73840em0
      PROD_WEB_URL: https://ancline-web-prod.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read public production OIDC settings
        id: oidc
        run: |
          set -euo pipefail
          curl -L -fsS --connect-timeout 10 --max-time 30 "https://ancline-api-prod.onrender.com/api/auth/oidc/configuration" -o /tmp/oidc.json
          jq -e '.configured==true and (.clientId|type=="string" and length>0) and (.redirectUri|type=="string" and length>0) and (.authorizationEndpoint|type=="string" and length>0)' /tmp/oidc.json >/dev/null
          echo "issuer=$(jq -r '.issuer' /tmp/oidc.json)" >> "$GITHUB_OUTPUT"
          echo "client_id=$(jq -r '.clientId' /tmp/oidc.json)" >> "$GITHUB_OUTPUT"
          echo "redirect_uri=$(jq -r '.redirectUri' /tmp/oidc.json)" >> "$GITHUB_OUTPUT"
          echo "authorization_endpoint=$(jq -r '.authorizationEndpoint' /tmp/oidc.json)" >> "$GITHUB_OUTPUT"

      - name: Build and push web hotfix
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:rb017-prod-sso-${{ github.sha }}
          build-args: |
            ANCLINE_BUILD_COMMIT=${{ github.sha }}
            NEXT_PUBLIC_API_URL=https://ancline-api-prod.onrender.com/api
            NEXT_PUBLIC_OIDC_ISSUER=${{ steps.oidc.outputs.issuer }}
            NEXT_PUBLIC_OIDC_CLIENT_ID=${{ steps.oidc.outputs.client_id }}
            NEXT_PUBLIC_OIDC_REDIRECT_URI=${{ steps.oidc.outputs.redirect_uri }}
            NEXT_PUBLIC_OIDC_AUTHORIZATION_ENDPOINT=${{ steps.oidc.outputs.authorization_endpoint }}
      - name: Deploy exact hotfix image to production web only
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          image="$IMAGE:rb017-prod-sso-$GITHUB_SHA"
          payload="$(jq -nc --arg image "$image" '{imageUrl:$image}')"
          code="$(curl -sS -o /tmp/deploy.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "https://api.render.com/v1/services/$PROD_WEB_SERVICE_ID/deploys")"
          cat /tmp/deploy.json
          [[ "$code" == "201" || "$code" == "202" ]]
      - name: Inspect live OIDC configuration safely
        run: |
          set -euo pipefail
          curl -L -fsS --connect-timeout 10 --max-time 30 "https://ancline-api-prod.onrender.com/api/auth/oidc/configuration" \
            | jq '{configured,devLoginAllowed,issuer,redirectUri,discoveryUrl,authorizationEndpoint,clientIdPresent:(.clientId|type=="string" and length>0)}'

      - name: Verify production SSO routing
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            code="$(curl -L -sS -o /tmp/oidc.json -w '%{http_code}' --connect-timeout 10 --max-time 30 "https://ancline-api-prod.onrender.com/api/auth/oidc/configuration" || true)"
            if [[ "$code" == "200" ]] && jq -e '.configured==true and .devLoginAllowed==false and (.authorizationEndpoint|type=="string")' /tmp/oidc.json >/dev/null; then
              cat /tmp/oidc.json
              exit 0
            fi
            sleep 8
          done
          cat /tmp/oidc.json 2>/dev/null || true
          exit 1
