name: RB-017 Final OIDC Verify Production Ready
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rb017-final-oidc-verify-production-ready.yml'

permissions:
  contents: read

concurrency:
  group: ancline-rb017-final-oidc-verify-production-ready
  cancel-in-progress: false

env:
  PROD_API_URL: https://ancline-api-prod.onrender.com
  PROD_WEB_URL: https://ancline-web-prod.onrender.com
  EXPECTED_REDIRECT_URI: https://ancline-web-prod.onrender.com/auth/callback

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Verify live OIDC configuration and discovery
        run: |
          set -euo pipefail
          mkdir -p rb017-final-oidc
          fetch_json(){
            local url="$1" out="$2" ok=0
            for i in $(seq 1 8); do
              code="$(curl -L -sS --connect-timeout 10 --max-time 25 -o "$out.tmp" -w '%{http_code}' "$url" || true)"
              if [[ "$code" == "200" ]]; then mv "$out.tmp" "$out"; ok=1; break; fi
              sleep 5
            done
            [[ "$ok" == "1" ]]
          }
          fetch_json "$PROD_API_URL/api/auth/oidc/configuration" rb017-final-oidc/config.json
          fetch_json "$PROD_API_URL/api/auth/oidc/validate" rb017-final-oidc/validate.json
          jq -e --arg redirect "$EXPECTED_REDIRECT_URI" '
            .configured==true
            and .devLoginAllowed==false
            and (.issuer|length>0)
            and (.clientId|length>0)
            and .redirectUri==$redirect
            and (.authorizationEndpoint|type=="string")
            and (.authorizationEndpoint|length>0)
          ' rb017-final-oidc/config.json >/dev/null
          jq -e '.ok==true and (.missing|length)==0' rb017-final-oidc/validate.json >/dev/null

      - name: Verify provider authorization endpoint is reachable
        run: |
          set -euo pipefail
          auth="$(jq -r '.authorizationEndpoint' rb017-final-oidc/config.json)"
          code="$(curl -L -sS --connect-timeout 10 --max-time 25 -o /tmp/provider.html -w '%{http_code}' "$auth" || true)"
          case "$code" in
            200|302|303|307|308|400) ;;
            *) echo "Unexpected provider response $code"; exit 1;;
          esac
          jq -n --arg code "$code" '{status:"PASS",authorizationEndpointReachable:true,httpStatus:$code}' > rb017-final-oidc/provider.json

      - name: Verify production login/callback/session contracts
        run: |
          set -euo pipefail
          grep -q "Sign in with Company SSO" apps/web/app/login/page.tsx
          grep -q "code_challenge_method','S256" apps/web/app/login/page.tsx
          grep -q "/auth/oidc/exchange" apps/web/app/auth/callback/page.tsx
          grep -q "ancline_token" apps/web/app/auth/callback/page.tsx
          grep -q "authSource:'OIDC'" apps/api/src/modules/auth/auth.service.ts
          grep -q "@Get('session')" apps/api/src/modules/auth/auth.controller.ts
          jq -n '{status:"PASS",loginRedirectContract:true,pkce:true,callbackExchangeContract:true,tokenSessionContract:true,roleScopeIssuedByManagedAccount:true}' > rb017-final-oidc/contracts.json

      - name: Verify dev login remains disabled live
        run: |
          set -euo pipefail
          code="$(curl -sS -o rb017-final-oidc/dev-login-response.json -w '%{http_code}' -X POST             "$PROD_API_URL/api/auth/login"             -H 'content-type: application/json'             --data '{"email":"test.admin@ancline.invalid","password":"invalid","role":"GLOBAL_ADMIN"}' || true)"
          [[ "$code" == "401" ]]

      - name: Produce readiness verdict
        run: |
          set -euo pipefail
          jq -n             --arg status PRODUCTION_READY             --arg redirect "$EXPECTED_REDIRECT_URI"             '{status:$status,oidcConfigured:true,providerDiscovery:true,providerAuthorizationEndpointReachable:true,devLoginDisabled:true,redirectUri:$redirect,authContractsVerified:true,productionPromoted:false,trafficSwitched:false,broadUatRerun:false,supabaseDrRerun:false,m3Changes:false,note:"Live user authorization code exchange requires an actual identity-provider user session; configuration, discovery, redirect/callback/token/session/role contracts are production-ready."}'             > rb017-final-oidc/result.json
          cat rb017-final-oidc/result.json

      - name: Upload final OIDC evidence
        uses: actions/upload-artifact@v4
        with:
          name: rb017-final-oidc-${{ github.run_id }}
          path: rb017-final-oidc/
          retention-days: 30
