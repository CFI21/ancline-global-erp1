name: CR-016 Free GHCR Staging Deploy
on:
  push:
    branches:
      - cr016-free-ghcr-staging-deploy

permissions:
  contents: read
  packages: write

concurrency:
  group: ancline-cr016-free-staging
  cancel-in-progress: false

env:
  TARGET_SHA: 338edc48dd2732d6d23502cbf4b9ecd8760accc5
  IMAGE: ghcr.io/cfi21/ancline-web
  IMAGE_TAG: sha-338edc48dd2732d6d23502cbf4b9ecd8760accc5
  API_URL: https://ancline-api-staging.onrender.com
  STAGING_WEB_URL: https://ancline-web-staging.onrender.com
  RENDER_WEB_SERVICE_ID: srv-dairuloae00c73fnfo1g
  RENDER_WORKSPACE_ID: tea-daiog6tg1s2s7385f4h0

jobs:
  build-deploy-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Build exact CR-016 image
        run: |
          set -euo pipefail
          docker build --platform linux/amd64             -f apps/web/Dockerfile             --build-arg ANCLINE_BUILD_COMMIT="$TARGET_SHA"             -t "$IMAGE:$IMAGE_TAG" .

      - name: Start local candidate against approved CR-015 API
        run: |
          set -euo pipefail
          docker run -d --rm             --name ancline-cr016-web             -p 3000:3000             -e PORT=3000             -e ANCLINE_API_URL="$API_URL"             -e NEXT_PUBLIC_API_URL=""             "$IMAGE:$IMAGE_TAG"
          for i in $(seq 1 60); do
            code="$(curl -sS -o /tmp/release.json -w '%{http_code}' http://127.0.0.1:3000/release-info || true)"
            if [[ "$code" == "200" ]] && jq -e --arg sha "$TARGET_SHA" '.buildCommit == $sha' /tmp/release.json >/dev/null; then
              cat /tmp/release.json
              exit 0
            fi
            sleep 2
          done
          docker logs ancline-cr016-web || true
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium

      - name: Local CR-016 UI hardening
        env:
          WEB_URL: http://127.0.0.1:3000
        run: node tools/live_ui_hardening.mjs

      - name: Login jobs and role regression on local candidate
        env:
          WEB_URL: http://127.0.0.1:3000
          EXPECTED_API_COMMIT: 04b6957860c7bb47576d76f1d6fe1b90dca81f9b
        run: node tools/live_ui_final_acceptance.mjs

      - name: Push immutable image to GHCR
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$IMAGE_TAG"

      - name: Switch staging web to free image-backed source and deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          IMAGE_URL="$IMAGE:$IMAGE_TAG"

          create_code="$(curl -sS -o /tmp/build-source.json -w '%{http_code}'             -X POST https://api.render.com/v1/build-sources             -H "Accept: application/json"             -H "Content-Type: application/json"             -H "Authorization: Bearer $RENDER_API_KEY"             --data "$(jq -nc               --arg owner "$RENDER_WORKSPACE_ID"               --arg name "ancline-web-staging-cr016-image"               --arg image "$IMAGE_URL"               '{ownerId:$owner,name:$name,image:{ownerId:$owner,imageUrl:$image}}')")"

          if [[ "$create_code" != "201" ]]; then
            cat /tmp/build-source.json
            echo "Unable to create image-backed build source"
            exit 1
          fi

          BUILD_SOURCE_ID="$(jq -r '.id' /tmp/build-source.json)"
          [[ -n "$BUILD_SOURCE_ID" && "$BUILD_SOURCE_ID" != "null" ]]

          attach_code="$(curl -sS -o /tmp/service-update.json -w '%{http_code}'             -X PATCH "https://api.render.com/v1/services/$RENDER_WEB_SERVICE_ID"             -H "Accept: application/json"             -H "Content-Type: application/json"             -H "Authorization: Bearer $RENDER_API_KEY"             --data "$(jq -nc --arg id "$BUILD_SOURCE_ID" '{buildSourceId:$id,autoDeploy:"no"}')")"
          [[ "$attach_code" == "200" ]] || { cat /tmp/service-update.json; exit 1; }

          deploy_code="$(curl -sS -o /tmp/deploy.json -w '%{http_code}'             -X POST "https://api.render.com/v1/services/$RENDER_WEB_SERVICE_ID/deploys"             -H "Accept: application/json"             -H "Content-Type: application/json"             -H "Authorization: Bearer $RENDER_API_KEY"             --data "$(jq -nc --arg image "$IMAGE_URL" '{imageUrl:$image}')")"
          [[ "$deploy_code" == "201" || "$deploy_code" == "202" ]] || { cat /tmp/deploy.json; exit 1; }

          DEPLOY_ID="$(jq -r '.id' /tmp/deploy.json)"
          for i in $(seq 1 90); do
            curl -sS               -H "Accept: application/json"               -H "Authorization: Bearer $RENDER_API_KEY"               "https://api.render.com/v1/services/$RENDER_WEB_SERVICE_ID/deploys/$DEPLOY_ID"               -o /tmp/deploy-status.json
            status="$(jq -r '.status' /tmp/deploy-status.json)"
            echo "deploy status: $status"
            if [[ "$status" == "live" ]]; then
              exit 0
            fi
            if [[ "$status" == "build_failed" || "$status" == "update_failed" || "$status" == "canceled" || "$status" == "deactivated" ]]; then
              cat /tmp/deploy-status.json
              exit 1
            fi
            sleep 10
          done
          cat /tmp/deploy-status.json
          exit 1

      - name: Verify live staging identity and API health
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            code="$(curl -L -sS -o /tmp/live-release.json -w '%{http_code}' --connect-timeout 10 --max-time 25 "$STAGING_WEB_URL/release-info" || true)"
            if [[ "$code" == "200" ]] && jq -e --arg sha "$TARGET_SHA" '.buildCommit == $sha' /tmp/live-release.json >/dev/null; then
              curl -L -fsS "$STAGING_WEB_URL/api-proxy/health" >/tmp/proxy-health.json
              cat /tmp/live-release.json
              cat /tmp/proxy-health.json
              exit 0
            fi
            sleep 10
          done
          cat /tmp/live-release.json 2>/dev/null || true
          exit 1

      - name: Final staging UI hardening
        env:
          WEB_URL: https://ancline-web-staging.onrender.com
        run: node tools/live_ui_hardening.mjs

      - name: Final staging login jobs and role regression
        env:
          WEB_URL: https://ancline-web-staging.onrender.com
          EXPECTED_API_COMMIT: 04b6957860c7bb47576d76f1d6fe1b90dca81f9b
        run: node tools/live_ui_final_acceptance.mjs

      - name: Upload CR-016 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cr016-free-staging-acceptance-${{ github.run_id }}
          path: |
            ui-hardening-artifacts/
            ui-acceptance-artifacts/
          retention-days: 30
