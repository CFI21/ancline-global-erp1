name: ANCLINE Restore Approved Pointers

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-approved-pointers.yml"

permissions:
  contents: read
  packages: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore approved Web and API latest pointers
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag ghcr.io/cfi21/ancline-web:latest ghcr.io/cfi21/ancline-web@sha256:68c9b55ed326026f55f6144a2c1d65e65e0eaa4e5393eb537e40ef71d85d4d91
          docker buildx imagetools create --tag ghcr.io/cfi21/ancline-api:latest ghcr.io/cfi21/ancline-api@sha256:0d49b0b661f343db2ba70ffc7697f6001e76072573dd7a6fd74ea4728e36c8c7

# restore-trigger: 2026-09-22T13:16+02:00
