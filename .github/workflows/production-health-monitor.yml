name: ANCLINE Production Health Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  production-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify production API and Web
        shell: bash
        run: |
          set -euo pipefail
          API_URL="https://ancline-api-prod.onrender.com"
          WEB_URL="https://ancline-web-prod.onrender.com"

          retry() {
            local url="$1" out="$2"
            for i in $(seq 1 12); do
              if curl -L -fsS --connect-timeout 10 --max-time 30 "$url" -o "$out"; then return 0; fi
              [[ "$i" == "12" ]] && return 1
              sleep 10
            done
          }

          retry "$API_URL/api/health" /tmp/api.json
          retry "$WEB_URL/release-info" /tmp/web.json
          retry "$WEB_URL/api-proxy/health" /tmp/proxy.json

          jq -e '.service=="ANCLINE API" and .deploymentTier=="production"' /tmp/api.json >/dev/null
          jq -e '.status=="online" and .service=="ANCLINE API"' /tmp/proxy.json >/dev/null

          echo "Production health/proxy monitor PASS"
