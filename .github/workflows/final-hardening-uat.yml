name: ANCLINE ECOM Final Hardening UAT

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/api/src/modules/workflow-automation/workflow-automation.service.ts'
      - 'apps/api/src/modules/integrations/integrations.service.ts'
      - 'apps/api/src/modules/accounting/accounting.service.ts'
      - 'apps/api/test/resilience-hardening.spec.ts'
      - 'tools/live_final_hardening_uat.mjs'
      - '.github/workflows/final-hardening-uat.yml'

concurrency:
  group: ancline-final-hardening-staging
  cancel-in-progress: true

jobs:
  final-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEB_URL: https://ancline-web-live.onrender.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve expected approved/candidate API runtime
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release-registry:refs/remotes/origin/release-registry
          git show origin/release-registry:approved-digests.json > /tmp/approved-hardening.json
          approved_api="$(jq -r '.current.api.commit' /tmp/approved-hardening.json)"
          if git diff --quiet "$approved_api" "$GITHUB_SHA" -- apps/api packages/db package.json package-lock.json tsconfig.json; then
            expected="$approved_api"
            echo "Hardening expects currently approved API: $expected"
          else
            expected="$GITHUB_SHA"
            echo "Hardening expects candidate API from this commit: $expected"
          fi
          echo "EXPECTED_API_COMMIT=$expected" >> "$GITHUB_ENV"
      - name: Prove hardening source identity
        run: |
          set -euo pipefail
          echo "commit=$GITHUB_SHA"
          sha256sum tools/live_final_hardening_uat.mjs
          grep -q "AutomationIdempotency" apps/api/src/modules/workflow-automation/workflow-automation.service.ts
          grep -q "INGEST_" apps/api/src/modules/integrations/integrations.service.ts
          grep -q "PAYREF" apps/api/src/modules/accounting/accounting.service.ts
      - name: Run concurrency, idempotency, failure, security and load acceptance
        run: node tools/live_final_hardening_uat.mjs
      - name: Upload final hardening evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ancline-final-hardening-${{ github.sha }}
          path: ANCLINE_FINAL_HARDENING_REPORT.json
          retention-days: 90
