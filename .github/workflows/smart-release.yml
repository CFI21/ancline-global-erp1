      - uses: actions/upload-artifact@v4
        with:
          name: ancline-smart-release-evidence-v2-${{ github.sha }}
          path: ANCLINE_SMART_RELEASE_EVIDENCE_V2.json
          retention-days: 90
      - name: Enforce release outcome
        run: |
          set -euo pipefail
          [[ "${{ needs.quality.result }}" == "success" ]] || exit 1
          [[ "${{ needs.promote.result }}" == "success" ]] || exit 1
          [[ "${{ needs.remote-gate.result }}" == "success" ]] || exit 1
          [[ "${{ needs.finalize.result }}" == "success" ]] || exit 1
