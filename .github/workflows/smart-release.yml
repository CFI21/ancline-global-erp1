name: ANCLINE Smart Release Hardened

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ancline-smart-release-${{ github.ref }}
  cancel-in-progress: true

env:
  WEB_URL: https://ancline-web-live.onrender.com
  API_URL: https://ancline-api-staging.onrender.com
  RENDER_WEB_SERVICE_ID: srv-dajbrh3m8hqs73fmdk30
  RENDER_API_SERVICE_ID: srv-daisqstg1s2s738kklb0

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.detect.outputs.web }}
      api: ${{ steps.detect.outputs.api }}
      shared: ${{ steps.detect.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        name: Detect affected components
        shell: bash
        run: |
          set -euo pipefail
          web=false; api=false; shared=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            web=true; api=true; shared=true
          else
            fallback="${{ github.event.before }}"
            if [[ -z "$fallback" || "$fallback" =~ ^0+$ ]]; then fallback="$(git rev-parse HEAD^)"; fi
            web_before="$fallback"
            api_before="$fallback"

            # Compare each runtime component with its last approved commit rather than
            # only the immediate parent. This preserves pending changes when a run is
            # cancelled/superseded by a later push.
            if git fetch origin release-registry:refs/remotes/origin/release-registry >/dev/null 2>&1 &&
               git show origin/release-registry:approved-digests.json > /tmp/approved-detect.json 2>/dev/null; then
              candidate_web="$(jq -r '.current.web.commit // empty' /tmp/approved-detect.json)"
              candidate_api="$(jq -r '.current.api.commit // empty' /tmp/approved-detect.json)"
              if [[ -n "$candidate_web" ]] && git cat-file -e "$candidate_web^{commit}" 2>/dev/null; then web_before="$candidate_web"; fi
              if [[ -n "$candidate_api" ]] && git cat-file -e "$candidate_api^{commit}" 2>/dev/null; then api_before="$candidate_api"; fi
            fi

            while IFS= read -r file; do
              case "$file" in
                apps/web/*) web=true ;;
                packages/bulk-release/*) ;;
                packages/db/*) ;;
                packages/*|package.json|package-lock.json|tsconfig.json)
                  web=true; api=true; shared=true ;;
              esac
            done < <(git diff --name-only "$web_before" "$GITHUB_SHA")

            while IFS= read -r file; do
              case "$file" in
                packages/bulk-release/*) ;;
                apps/api/*|packages/db/*) api=true ;;
                packages/*|package.json|package-lock.json|tsconfig.json)
                  web=true; api=true; shared=true ;;
              esac
            done < <(git diff --name-only "$api_before" "$GITHUB_SHA")

            echo "Detection baselines: web=$web_before api=$api_before fallback=$fallback"
          fi
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "shared=$shared" >> "$GITHUB_OUTPUT"
          echo "Affected: web=$web api=$api shared=$shared"


  post_acceptance_gate:
    needs: changes
    runs-on: ubuntu-latest
    outputs:
      runtime_change: ${{ steps.gate.outputs.runtime_change }}
      regression_scope: ${{ steps.gate.outputs.regression_scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: gate
        name: Enforce approved post-acceptance change request
        shell: bash
        run: |
          set -euo pipefail
          web="${{ needs.changes.outputs.web }}"
          api="${{ needs.changes.outputs.api }}"
          shared="${{ needs.changes.outputs.shared }}"
          runtime_change=false
          [[ "$web" == "true" || "$api" == "true" ]] && runtime_change=true
          echo "runtime_change=$runtime_change" >> "$GITHUB_OUTPUT"

          if [[ "$runtime_change" != "true" ]]; then
            echo "regression_scope=NONE" >> "$GITHUB_OUTPUT"
            echo "No runtime component changed; approved change request is not required."
            exit 0
          fi

          test -f infra/go-live/job-done-final-acceptance.json
          test "$(jq -r '.status' infra/go-live/job-done-final-acceptance.json)" = "FINAL_ACCEPTED"
          test -f infra/change-control/active-change-request.json

          cr_status="$(jq -r '.status // empty' infra/change-control/active-change-request.json)"
          test "$cr_status" = "APPROVED"

          # Post-acceptance changes must be based on the latest approved staging
          # runtime in the hardened release registry, not the historical JOB_DONE
          # seed commits. JOB_DONE remains required as the root acceptance record.
          git fetch origin release-registry:refs/remotes/origin/release-registry >/dev/null 2>&1
          git show origin/release-registry:approved-digests.json > /tmp/approved-gate.json
          base_web="$(jq -r '.current.web.commit // empty' /tmp/approved-gate.json)"
          base_api="$(jq -r '.current.api.commit // empty' /tmp/approved-gate.json)"
          test -n "$base_web"; test -n "$base_api"
          test "$(jq -r '.baselineWebCommit // empty' infra/change-control/active-change-request.json)" = "$base_web"
          test "$(jq -r '.baselineApiCommit // empty' infra/change-control/active-change-request.json)" = "$base_api"

          approved_at="$(jq -r '.approvedAt // empty' infra/change-control/active-change-request.json)"
          approved_by="$(jq -r '.approvedBy // empty' infra/change-control/active-change-request.json)"
          cr_id="$(jq -r '.id // empty' infra/change-control/active-change-request.json)"
          test -n "$approved_at"; test -n "$approved_by"; test -n "$cr_id"

          if [[ "$web" == "true" ]]; then jq -e '.components | index("web") or index("shared")' infra/change-control/active-change-request.json >/dev/null; fi
          if [[ "$api" == "true" ]]; then jq -e '.components | index("api") or index("shared")' infra/change-control/active-change-request.json >/dev/null; fi

          scopes="$(jq -r '.regressionScopes | join(",")' infra/change-control/active-change-request.json)"
          if [[ "$shared" == "true" || ("$web" == "true" && "$api" == "true") ]]; then
            for s in WEB_BUILD API_TEST_BUILD ROLE_BROWSER_UAT RESPONSIVE_FAILURE_ACCESSIBILITY TRANSACTION_LIFECYCLE CONCURRENCY_IDEMPOTENCY_PROVIDER_PAYMENT_SECURITY; do
              jq -e --arg s "$s" '.regressionScopes | index($s)' infra/change-control/active-change-request.json >/dev/null
            done
            scope="SHARED"
          elif [[ "$web" == "true" ]]; then
            for s in WEB_BUILD ROLE_BROWSER_UAT RESPONSIVE_FAILURE_ACCESSIBILITY; do
              jq -e --arg s "$s" '.regressionScopes | index($s)' infra/change-control/active-change-request.json >/dev/null
            done
            scope="WEB"
          else
            for s in API_TEST_BUILD TRANSACTION_LIFECYCLE CONCURRENCY_IDEMPOTENCY_PROVIDER_PAYMENT_SECURITY; do
              jq -e --arg s "$s" '.regressionScopes | index($s)' infra/change-control/active-change-request.json >/dev/null
            done
            scope="API"
          fi

          echo "regression_scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Approved change request $cr_id accepted for scope $scope ($scopes)."

  preflight_render_api:
    needs: [changes, post_acceptance_gate]
    runs-on: ubuntu-latest
    steps:
      - name: Validate Render API authentication and target services
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$RENDER_API_KEY" ]]; then
            echo "::error::RENDER_API_KEY is missing. No image promotion was attempted."
            exit 1
          fi

          check_service() {
            local label="$1"
            local service_id="$2"
            local out="/tmp/render-${service_id}.json"
            local code
            code="$(curl -sS -o "$out" -w '%{http_code}' \
              --connect-timeout 10 --max-time 30 \
              -H "Accept: application/json" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/${service_id}" || true)"
            if [[ "$code" != "200" ]]; then
              echo "::error::Render API preflight failed for ${label} (HTTP ${code})."
              exit 1
            fi
            actual="$(jq -r '.service.id // .id // empty' "$out")"
            if [[ -n "$actual" && "$actual" != "$service_id" ]]; then
              echo "::error::Render API returned the wrong service for ${label}."
              exit 1
            fi
            echo "${label} Render API preflight PASS"
          }

          if [[ "${{ needs.changes.outputs.web }}" == "true" ]]; then
            check_service "Web" "$RENDER_WEB_SERVICE_ID"
          fi
          if [[ "${{ needs.changes.outputs.api }}" == "true" ]]; then
            check_service "API" "$RENDER_API_SERVICE_ID"
          fi
          echo "Render API preflight PASS"

  baseline:
    needs: [changes, post_acceptance_gate, preflight_render_api]
    runs-on: ubuntu-latest
    outputs:
      web_digest: ${{ steps.capture.outputs.web_digest }}
      api_digest: ${{ steps.capture.outputs.api_digest }}
      web_commit: ${{ steps.capture.outputs.web_commit }}
      api_commit: ${{ steps.capture.outputs.api_commit }}
      web_image: ${{ steps.capture.outputs.web_image }}
      api_image: ${{ steps.capture.outputs.api_image }}
      registry_present: ${{ steps.capture.outputs.registry_present }}
      registry_sha256: ${{ steps.capture.outputs.registry_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: capture
        name: Load trusted approved registry and prove runtime baseline
        shell: bash
        run: |
          set -euo pipefail
          registry_present=false
          registry_sha256=""
          reg_web_digest=""
          reg_api_digest=""
          reg_web_commit=""
          reg_api_commit=""
          reg_web_image=""
          reg_api_image=""

          if git fetch origin release-registry:refs/remotes/origin/release-registry >/dev/null 2>&1 &&
             git show origin/release-registry:approved-digests.json > /tmp/approved-digests.json 2>/dev/null; then
            registry_present=true
            registry_sha256="$(sha256sum /tmp/approved-digests.json | awk '{print $1}')"
            reg_web_digest="$(jq -r '.current.web.digest // empty' /tmp/approved-digests.json)"
            reg_api_digest="$(jq -r '.current.api.digest // empty' /tmp/approved-digests.json)"
            reg_web_commit="$(jq -r '.current.web.commit // empty' /tmp/approved-digests.json)"
            reg_api_commit="$(jq -r '.current.api.commit // empty' /tmp/approved-digests.json)"
            reg_web_image="$(jq -r '.current.web.immutableTag // empty' /tmp/approved-digests.json)"
            reg_api_image="$(jq -r '.current.api.immutableTag // empty' /tmp/approved-digests.json)"
          fi

          live_web_commit="unknown"
          live_api_commit="unknown"
          for i in $(seq 1 18); do
            if curl -L -fsS --connect-timeout 10 --max-time 25 "$WEB_URL/release-info" -o /tmp/baseline-web.json 2>/dev/null; then
              candidate="$(jq -r '.buildCommit // "unknown"' /tmp/baseline-web.json 2>/dev/null || echo unknown)"
              [[ -n "$candidate" && "$candidate" != "null" ]] && live_web_commit="$candidate"
            fi
            if curl -L -fsS --connect-timeout 10 --max-time 25 "$API_URL/api/health" -o /tmp/baseline-api.json 2>/dev/null; then
              candidate="$(jq -r '.buildCommit // "unknown"' /tmp/baseline-api.json 2>/dev/null || echo unknown)"
              [[ -n "$candidate" && "$candidate" != "null" ]] && live_api_commit="$candidate"
            fi
            if [[ "$live_web_commit" != "unknown" && "$live_api_commit" != "unknown" ]]; then break; fi
            [[ "$i" == "18" ]] && break
            sleep 10
          done

          if [[ "$registry_present" == "true" ]]; then
            [[ -n "$reg_web_digest" && -n "$reg_api_digest" && -n "$reg_web_commit" && -n "$reg_api_commit" && -n "$reg_web_image" && -n "$reg_api_image" ]] || {
              echo "Approved registry is incomplete"; exit 1;
            }

            # Post-acceptance Web may be intentionally pinned to the separately proven UI freeze.
            expected_web_commit="$reg_web_commit"
            web_digest="$reg_web_digest"
            web_image="$reg_web_image"
            if [[ -f infra/go-live/ui-final-freeze.json ]] &&
               [[ "$(jq -r '.status // empty' infra/go-live/ui-final-freeze.json)" == "FROZEN_PASS" ]]; then
              freeze_commit="$(jq -r '.web.commit // empty' infra/go-live/ui-final-freeze.json)"
              freeze_digest="$(jq -r '.web.imageDigest // empty' infra/go-live/ui-final-freeze.json)"
              freeze_image="$(jq -r '.web.image // empty' infra/go-live/ui-final-freeze.json)"
              if [[ -n "$freeze_commit" && -n "$freeze_digest" && -n "$freeze_image" && "$reg_web_commit" == "$freeze_commit" ]]; then
                expected_web_commit="$freeze_commit"
                web_digest="$freeze_digest"
                web_image="$freeze_image"
                echo "Using FROZEN_PASS Web baseline $expected_web_commit"
              elif [[ -n "$freeze_commit" && "$reg_web_commit" != "$freeze_commit" ]]; then
                echo "Approved registry supersedes legacy FROZEN_PASS Web baseline: registry=$reg_web_commit freeze=$freeze_commit"
              fi
            fi

            [[ "$live_web_commit" == "$expected_web_commit" ]] || {
              echo "Web runtime drift: live=$live_web_commit approved=$expected_web_commit"; exit 1;
            }
            [[ "$live_api_commit" == "$reg_api_commit" ]] || {
              echo "API runtime drift: live=$live_api_commit registry=$reg_api_commit"; exit 1;
            }
            api_digest="$reg_api_digest"
            web_commit="$expected_web_commit"
            api_commit="$reg_api_commit"
            api_image="$reg_api_image"
          else
            echo "::error::Approved release registry is required for hardened release control."
            exit 1
          fi

          echo "web_digest=$web_digest" >> "$GITHUB_OUTPUT"
          echo "api_digest=$api_digest" >> "$GITHUB_OUTPUT"
          echo "web_commit=$web_commit" >> "$GITHUB_OUTPUT"
          echo "api_commit=$api_commit" >> "$GITHUB_OUTPUT"
          echo "web_image=$web_image" >> "$GITHUB_OUTPUT"
          echo "api_image=$api_image" >> "$GITHUB_OUTPUT"
          echo "registry_present=$registry_present" >> "$GITHUB_OUTPUT"
          echo "registry_sha256=$registry_sha256" >> "$GITHUB_OUTPUT"
          printf 'Trusted baseline web=%s (%s) api=%s (%s) registry=%s\n' "$web_digest" "$web_commit" "$api_digest" "$api_commit" "$registry_present"

  quality:
    needs: [changes, preflight_render_api]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true'
        run: npm ci
      - if: needs.changes.outputs.api == 'true'
        run: npm run db:generate
      - if: needs.changes.outputs.api == 'true'
        run: npm run test:ci -w apps/api
      - if: needs.changes.outputs.api == 'true'
        run: npm run build -w apps/api
      - name: Validate release package and Phase 10 staging-gate coherence
        run: |
          python tools/release_check.py
          python tools/phase6_gate.py
      - if: needs.changes.outputs.web == 'true'
        name: Reject legacy page sidebars
        run: |
          if grep -RIl --include='page.tsx' '<aside className="side"' apps/web/app; then
            echo "Legacy page-specific sidebar found. Use WorkspaceShell instead."
            exit 1
          fi
      - if: needs.changes.outputs.web == 'true'
        run: npm run build -w apps/web
      - if: needs.changes.outputs.web != 'true' && needs.changes.outputs.api != 'true'
        run: echo "No runtime component changed."

  build-web:
    needs: [changes, quality]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/cfi21/ancline-web:sha-${{ github.sha }}
          build-args: ANCLINE_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  build-api:
    needs: [changes, quality]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/cfi21/ancline-api:sha-${{ github.sha }}
          build-args: ANCLINE_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  promote:
    needs: [changes, preflight_render_api, baseline, quality, build-web, build-api]
    if: |
      always() &&
      (needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true') &&
      needs.preflight_render_api.result == 'success' &&
      needs.baseline.result == 'success' &&
      needs.quality.result == 'success' &&
      (needs.build-web.result == 'success' || needs.build-web.result == 'skipped') &&
      (needs.build-api.result == 'success' || needs.build-api.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy immutable candidate images through Render API
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          deploy_image() {
            local label="$1"
            local service_id="$2"
            local image="$3"
            local out="/tmp/deploy-${service_id}.json"
            local payload code
            payload="$(jq -nc --arg image "$image" '{imageUrl:$image}')"
            code="$(curl -sS -o "$out" -w '%{http_code}' -X POST \
              --connect-timeout 10 --max-time 60 \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              --data "$payload" \
              "https://api.render.com/v1/services/${service_id}/deploys" || true)"
            if [[ "$code" != "201" && "$code" != "202" ]]; then
              echo "::error::${label} Render API deploy failed (HTTP ${code})."
              cat "$out" 2>/dev/null || true
              exit 1
            fi
            deploy_id="$(jq -r '.id // .deploy.id // empty' "$out")"
            echo "${label} candidate deploy accepted${deploy_id:+: ${deploy_id}}"
          }

          if [[ "${{ needs.changes.outputs.web }}" == "true" ]]; then
            deploy_image "Web" "$RENDER_WEB_SERVICE_ID" "ghcr.io/cfi21/ancline-web:sha-$GITHUB_SHA"
          fi
          if [[ "${{ needs.changes.outputs.api }}" == "true" ]]; then
            deploy_image "API" "$RENDER_API_SERVICE_ID" "ghcr.io/cfi21/ancline-api:sha-$GITHUB_SHA"
          fi

  remote-gate:
    needs: [changes, baseline, build-web, build-api, promote]
    if: always() && needs.promote.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      api_commit: ${{ steps.runtime.outputs.api_commit }}
      web_commit: ${{ steps.runtime.outputs.web_commit }}
      uat_status: ${{ steps.runtime.outputs.uat_status }}
      uat_run_id: ${{ steps.runtime.outputs.uat_run_id }}
      backup_status: ${{ steps.runtime.outputs.backup_status }}
      backup_sha256: ${{ steps.runtime.outputs.backup_sha256 }}
      backup_artifact_sha256: ${{ steps.backup.outputs.artifact_sha256 }}
      drill_triggered: ${{ steps.drill.outputs.triggered }}
    steps:
      - name: Wait for direct API
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            code="$(curl -L -sS -o /tmp/api-health.json -w '%{http_code}' --connect-timeout 10 --max-time 25 "$API_URL/api/health" || true)"
            if [[ "$code" == "200" ]]; then
              if [[ "${{ needs.changes.outputs.api }}" == "true" ]]; then
                jq -e --arg sha "$GITHUB_SHA" '.buildCommit == $sha' /tmp/api-health.json >/dev/null && break
              else
                jq -e '.status == "online" and .service == "ANCLINE API"' /tmp/api-health.json >/dev/null && break
              fi
            fi
            [[ "$i" == "60" ]] && { echo "API health/identity timeout"; cat /tmp/api-health.json 2>/dev/null || true; exit 1; }
            sleep 10
          done

      - name: Require API transactional UAT and backup evidence
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            code="$(curl -L -sS -o /tmp/release-evidence.json -w '%{http_code}' --connect-timeout 10 --max-time 25 "$API_URL/api/release/evidence" || true)"
            if [[ "$code" == "200" ]]; then
              if [[ "${{ needs.changes.outputs.api }}" == "true" ]]; then
                predicate='.releaseCommit == $sha and .ready == true and .uat.status == "PASS" and .uat.summary.failed == 0 and .uat.summary.total >= 20 and .uat.summary.passed == .uat.summary.total and .backup.status == "PASS" and .backup.offPlatformArtifactReady == true'
              else
                predicate='.ready == true and .uat.status == "PASS" and .backup.status == "PASS"'
              fi
              jq -e --arg sha "$GITHUB_SHA" "$predicate" /tmp/release-evidence.json >/dev/null && break
            fi
            [[ "$i" == "60" ]] && { echo "API release evidence timeout"; cat /tmp/release-evidence.json 2>/dev/null || true; exit 1; }
            sleep 10
          done

      - name: Require deployed Web image identity
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            code="$(curl -L -sS -o /tmp/web-release.json -w '%{http_code}' --connect-timeout 10 --max-time 25 "$WEB_URL/release-info" || true)"
            if [[ "$code" == "200" ]]; then
              if [[ "${{ needs.changes.outputs.web }}" == "true" ]]; then
                jq -e --arg sha "$GITHUB_SHA" '.status == "online" and .service == "ANCLINE Web" and .buildCommit == $sha' /tmp/web-release.json >/dev/null && break
              else
                jq -e '.status == "online" and .service == "ANCLINE Web"' /tmp/web-release.json >/dev/null && break
              fi
            fi
            [[ "$i" == "60" ]] && { echo "Web release identity timeout"; cat /tmp/web-release.json 2>/dev/null || true; exit 1; }
            sleep 10
          done

      - name: Validate Web to API runtime proxy
        run: |
          set -euo pipefail
          curl -L -fsS --connect-timeout 10 --max-time 25 "$API_URL/api/health" -o /tmp/api-health-current.json
          curl -L -fsS --connect-timeout 10 --max-time 25 "$WEB_URL/api-proxy/health" -o /tmp/proxy-health.json
          jq -e '.status == "online" and .service == "ANCLINE API"' /tmp/api-health-current.json >/dev/null
          jq -e '.status == "online" and .service == "ANCLINE API"' /tmp/proxy-health.json >/dev/null
          direct="$(jq -r .buildCommit /tmp/api-health-current.json)"
          proxy="$(jq -r .buildCommit /tmp/proxy-health.json)"
          [[ "$direct" == "$proxy" ]] || { echo "API identity mismatch direct=$direct proxy=$proxy"; exit 1; }

      - name: Validate public Web routes
        run: |
          set -euo pipefail
          for path in / /login; do
            code="$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 25 "$WEB_URL$path")"
            [[ "$code" == "200" ]] || { echo "$path HTTP $code"; exit 1; }
          done

      - id: drill
        name: Mark validated full auto-rollback drill
        if: contains(github.event.head_commit.message, '[rollback-drill]')
        run: |
          echo "triggered=true" >> "$GITHUB_OUTPUT"
          echo "Candidate runtime passed all validation gates. Automatic Render API recovery drill requested."

      - id: backup
        name: Fetch encrypted off-platform backup envelope
        run: |
          set -euo pipefail
          curl -L -fsS --connect-timeout 10 --max-time 60 "$API_URL/api/free-backup/offplatform-envelope" -o ANCLINE_OFFPLATFORM_BACKUP_ENVELOPE.json
          jq -e '.format == "ANCLINE_OFFPLATFORM_BACKUP_ENVELOPE_V1" and .algorithm == "RSA-OAEP-SHA256+AES-256-GCM"' ANCLINE_OFFPLATFORM_BACKUP_ENVELOPE.json >/dev/null
          release_sha="$(jq -r .releaseCommit ANCLINE_OFFPLATFORM_BACKUP_ENVELOPE.json)"
          evidence_sha="$(jq -r .backup.sha256 /tmp/release-evidence.json)"
          envelope_sha="$(jq -r .ciphertextSha256 ANCLINE_OFFPLATFORM_BACKUP_ENVELOPE.json)"
          [[ "$envelope_sha" == "$evidence_sha" ]] || { echo "Backup evidence mismatch"; exit 1; }
          if [[ "${{ needs.changes.outputs.api }}" == "true" ]]; then [[ "$release_sha" == "$GITHUB_SHA" ]] || { echo "Backup release identity mismatch"; exit 1; }; fi
          artifact_sha="$(sha256sum ANCLINE_OFFPLATFORM_BACKUP_ENVELOPE.json | awk '{print $1}')"
          echo "artifact_sha256=$artifact_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ancline-offplatform-backup-${{ github.sha }}
          path: ANCLINE_OFFPLATFORM_BACKUP_ENVELOPE.json
          retention-days: 30

      - id: runtime
        name: Capture deployed runtime evidence
        run: |
          set -euo pipefail
          curl -L -fsS "$API_URL/api/health" -o /tmp/api-health-final.json
          curl -L -fsS "$API_URL/api/release/evidence" -o /tmp/release-evidence-final.json
          curl -L -fsS "$WEB_URL/release-info" -o /tmp/web-release-final.json
          echo "api_commit=$(jq -r .buildCommit /tmp/api-health-final.json)" >> "$GITHUB_OUTPUT"
          echo "web_commit=$(jq -r .buildCommit /tmp/web-release-final.json)" >> "$GITHUB_OUTPUT"
          echo "uat_status=$(jq -r .uat.status /tmp/release-evidence-final.json)" >> "$GITHUB_OUTPUT"
          echo "uat_run_id=$(jq -r '.uat.runId // ""' /tmp/release-evidence-final.json)" >> "$GITHUB_OUTPUT"
          echo "backup_status=$(jq -r .backup.status /tmp/release-evidence-final.json)" >> "$GITHUB_OUTPUT"
          echo "backup_sha256=$(jq -r '.backup.sha256 // ""' /tmp/release-evidence-final.json)" >> "$GITHUB_OUTPUT"

  impact_regression:
    needs: [changes, post_acceptance_gate, baseline, build-web, build-api, remote-gate]
    if: always() && needs.remote-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # All live acceptance tools reseed/mutate the same synthetic 50001-50005 staging fixture.
    # Serialize the full regression job so a second release cannot delete a consol or reset auth mid-run.
    concurrency:
      group: ancline-shared-staging-mutation-uat
      cancel-in-progress: false
    env:
      WEB_URL: https://ancline-web-live.onrender.com
      EXPECTED_API_COMMIT: ${{ needs.remote-gate.outputs.api_commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - if: needs.changes.outputs.api == 'true'
        name: API transaction lifecycle regression
        run: node tools/live_transaction_mutation_uat.mjs

      - if: needs.changes.outputs.api == 'true'
        name: API resilience security regression
        run: node tools/live_final_hardening_uat.mjs

      - if: needs.changes.outputs.web == 'true'
        name: Install browser accessibility runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium

      - if: needs.changes.outputs.web == 'true'
        name: Role browser regression
        run: node tools/live_ui_final_acceptance.mjs

      - if: needs.changes.outputs.web == 'true'
        name: Responsive failure accessibility regression
        run: node tools/live_ui_hardening.mjs

      - if: needs.changes.outputs.web == 'true'
        name: Job workspace navigation acceptance
        run: node tools/live_cr009_job_navigation_acceptance.mjs

      - name: Write impact regression evidence
        shell: bash
        run: |
          mkdir -p impact-regression-artifacts
          jq -n             --arg scope "${{ needs.post_acceptance_gate.outputs.regression_scope }}"             --arg web "${{ needs.changes.outputs.web }}"             --arg api "${{ needs.changes.outputs.api }}"             --arg sha "$GITHUB_SHA"             '{schema:"ANCLINE_IMPACT_SCOPED_REGRESSION_V1",status:"PASS",scope:$scope,webChanged:($web=="true"),apiChanged:($api=="true"),candidateCommit:$sha}'             > impact-regression-artifacts/ANCLINE_IMPACT_SCOPED_REGRESSION.json

      - uses: actions/upload-artifact@v4
        with:
          name: ancline-impact-regression-${{ github.sha }}
          path: impact-regression-artifacts/
          retention-days: 90

  finalize:
    needs: [changes, baseline, build-web, build-api, remote-gate, impact_regression]
    if: |
      always() &&
      needs.remote-gate.result == 'success' &&
      needs.impact_regression.result == 'success' &&
      needs.remote-gate.outputs.drill_triggered != 'true'
    runs-on: ubuntu-latest
    outputs:
      registry_sha256: ${{ steps.registry.outputs.registry_sha256 }}
      registry_commit: ${{ steps.registry.outputs.registry_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: needs.changes.outputs.web == 'true'
        name: Register approved Web digest
        run: |
          set -euo pipefail
          image="ghcr.io/cfi21/ancline-web:sha-$GITHUB_SHA"
          expected="${{ needs.build-web.outputs.digest }}"
          actual=""
          for i in $(seq 1 12); do
            actual="$(docker buildx imagetools inspect "$image" 2>/dev/null | awk '/^Digest:/ {print $2; exit}' || true)"
            [[ "$actual" == "$expected" ]] && break
            sleep 5
          done
          [[ "$actual" == "$expected" ]] || { echo "::error::Web digest verification failed expected=$expected actual=$actual"; exit 1; }
          for i in $(seq 1 5); do
            if docker buildx imagetools create --tag ghcr.io/cfi21/ancline-web:latest --tag ghcr.io/cfi21/ancline-web:staging-approved-current --tag ghcr.io/cfi21/ancline-web:staging-approved-$(echo "$GITHUB_SHA" | cut -c1-12) "$image"; then
              exit 0
            fi
            [[ "$i" == "5" ]] && exit 1
            sleep 5
          done
      - if: needs.changes.outputs.api == 'true'
        name: Register approved API digest
        run: |
          set -euo pipefail
          image="ghcr.io/cfi21/ancline-api:sha-$GITHUB_SHA"
          expected="${{ needs.build-api.outputs.digest }}"
          actual=""
          for i in $(seq 1 12); do
            actual="$(docker buildx imagetools inspect "$image" 2>/dev/null | awk '/^Digest:/ {print $2; exit}' || true)"
            [[ "$actual" == "$expected" ]] && break
            sleep 5
          done
          [[ "$actual" == "$expected" ]] || { echo "::error::API digest verification failed expected=$expected actual=$actual"; exit 1; }
          for i in $(seq 1 5); do
            if docker buildx imagetools create --tag ghcr.io/cfi21/ancline-api:latest --tag ghcr.io/cfi21/ancline-api:staging-approved-current --tag ghcr.io/cfi21/ancline-api:staging-approved-$(echo "$GITHUB_SHA" | cut -c1-12) "$image"; then
              exit 0
            fi
            [[ "$i" == "5" ]] && exit 1
            sleep 5
          done
      - id: registry
        name: Persist approved digest registry branch
        env:
          WEB_CHANGED: ${{ needs.changes.outputs.web }}
          API_CHANGED: ${{ needs.changes.outputs.api }}
          NEW_WEB_DIGEST: ${{ needs.build-web.outputs.digest }}
          NEW_API_DIGEST: ${{ needs.build-api.outputs.digest }}
          WEB_COMMIT: ${{ needs.remote-gate.outputs.web_commit }}
          API_COMMIT: ${{ needs.remote-gate.outputs.api_commit }}
          UAT_RUN_ID: ${{ needs.remote-gate.outputs.uat_run_id }}
          BACKUP_SHA: ${{ needs.remote-gate.outputs.backup_sha256 }}
          BACKUP_ARTIFACT_SHA: ${{ needs.remote-gate.outputs.backup_artifact_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release-registry:refs/remotes/origin/release-registry
          git show origin/release-registry:approved-digests.json > /tmp/approved-before.json

          python - <<'PY'
          import json, os
          from datetime import datetime, timezone

          with open('/tmp/approved-before.json') as f:
              reg=json.load(f)

          reg['schema']='ANCLINE_APPROVED_DIGEST_REGISTRY_V2'
          reg['updatedAt']=datetime.now(timezone.utc).isoformat()
          reg['source']='smart-release-hardened'
          current=reg.setdefault('current',{})

          if os.getenv('WEB_CHANGED')=='true':
              current['web']={
                  'commit':os.environ['GITHUB_SHA'],
                  'immutableTag':f"ghcr.io/cfi21/ancline-web:sha-{os.environ['GITHUB_SHA']}",
                  'approvedTag':f"ghcr.io/cfi21/ancline-web:staging-approved-{os.environ['GITHUB_SHA'][:12]}",
                  'digest':os.getenv('NEW_WEB_DIGEST')
              }

          if os.getenv('API_CHANGED')=='true':
              current['api']={
                  'commit':os.environ['GITHUB_SHA'],
                  'immutableTag':f"ghcr.io/cfi21/ancline-api:sha-{os.environ['GITHUB_SHA']}",
                  'approvedTag':f"ghcr.io/cfi21/ancline-api:staging-approved-{os.environ['GITHUB_SHA'][:12]}",
                  'digest':os.getenv('NEW_API_DIGEST')
              }

          item={
              'runId':os.environ['GITHUB_RUN_ID'],
              'approvedAt':reg['updatedAt'],
              'commit':os.environ['GITHUB_SHA'],
              'components':[x for x,flag in [('web',os.getenv('WEB_CHANGED')),('api',os.getenv('API_CHANGED'))] if flag=='true'],
              'uatRunId':os.getenv('UAT_RUN_ID') or None,
              'backupSha256':os.getenv('BACKUP_SHA') or None,
              'offPlatformArtifactSha256':os.getenv('BACKUP_ARTIFACT_SHA') or None
          }
          history=[item]+list(reg.get('history') or [])
          reg['history']=history[:50]

          with open('/tmp/approved-digests.json','w') as f:
              json.dump(reg,f,indent=2)
              f.write('\n')
          PY

          registry_sha="$(sha256sum /tmp/approved-digests.json | awk '{print $1}')"

          git config user.name "ANCLINE Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git switch -C release-registry origin/release-registry
          cp /tmp/approved-digests.json approved-digests.json
          git add approved-digests.json
          if git diff --cached --quiet; then
            echo "Registry unchanged"
          else
            git commit -m "Approve ANCLINE release $GITHUB_SHA"
            git push origin HEAD:release-registry
          fi
          registry_commit="$(git rev-parse HEAD)"
          echo "registry_sha256=$registry_sha" >> "$GITHUB_OUTPUT"
          echo "registry_commit=$registry_commit" >> "$GITHUB_OUTPUT"
          cp approved-digests.json "$GITHUB_WORKSPACE/ANCLINE_APPROVED_DIGEST_REGISTRY.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ancline-approved-digest-registry-${{ github.sha }}
          path: ANCLINE_APPROVED_DIGEST_REGISTRY.json
          retention-days: 90

  recovery:
    needs: [changes, baseline, promote, remote-gate, impact_regression, finalize]
    if: |
      always() &&
      needs.promote.result == 'success' &&
      (
        needs.remote-gate.result == 'failure' ||
        needs.impact_regression.result == 'failure' ||
        needs.finalize.result == 'failure' ||
        (needs.remote-gate.result == 'success' && needs.remote-gate.outputs.drill_triggered == 'true')
      ) &&
      (needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true')
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.verify.outputs.status }}
    steps:
      - name: Trigger exact approved-image rollback through Render API
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BASE_WEB_COMMIT: ${{ needs.baseline.outputs.web_commit }}
          BASE_API_COMMIT: ${{ needs.baseline.outputs.api_commit }}
          BASE_WEB_IMAGE: ${{ needs.baseline.outputs.web_image }}
          BASE_API_IMAGE: ${{ needs.baseline.outputs.api_image }}
        shell: bash
        run: |
          set -euo pipefail

          deploy_image() {
            local label="$1"
            local service_id="$2"
            local image="$3"
            local out="/tmp/rollback-${service_id}.json"
            local payload code
            payload="$(jq -nc --arg image "$image" '{imageUrl:$image}')"
            code="$(curl -sS -o "$out" -w '%{http_code}' -X POST \
              --connect-timeout 10 --max-time 60 \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              --data "$payload" \
              "https://api.render.com/v1/services/${service_id}/deploys" || true)"
            if [[ "$code" != "201" && "$code" != "202" ]]; then
              echo "::error::${label} automatic rollback deploy failed (HTTP ${code})."
              cat "$out" 2>/dev/null || true
              exit 1
            fi
            echo "${label} approved-image rollback accepted"
          }

          if [[ "${{ needs.changes.outputs.web }}" == "true" ]]; then
            deploy_image "Web" "$RENDER_WEB_SERVICE_ID" "$BASE_WEB_IMAGE"
          fi
          if [[ "${{ needs.changes.outputs.api }}" == "true" ]]; then
            deploy_image "API" "$RENDER_API_SERVICE_ID" "$BASE_API_IMAGE"
          fi

      - id: verify
        name: Verify recovered runtime
        env:
          BASE_WEB_COMMIT: ${{ needs.baseline.outputs.web_commit }}
          BASE_API_COMMIT: ${{ needs.baseline.outputs.api_commit }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            api_ok=false; web_ok=false
            if curl -L -fsS "$API_URL/api/health" -o /tmp/recovery-api.json; then
              current="$(jq -r '.buildCommit // "unknown"' /tmp/recovery-api.json)"
              if [[ "${{ needs.changes.outputs.api }}" != "true" || "$current" == "$BASE_API_COMMIT" ]]; then api_ok=true; fi
            fi
            if curl -L -fsS "$WEB_URL/release-info" -o /tmp/recovery-web.json; then
              current="$(jq -r '.buildCommit // "unknown"' /tmp/recovery-web.json)"
              if [[ "${{ needs.changes.outputs.web }}" != "true" || "$current" == "$BASE_WEB_COMMIT" ]]; then web_ok=true; fi
            fi
            if [[ "$api_ok" == "true" && "$web_ok" == "true" ]] &&
               curl -L -fsS "$WEB_URL/api-proxy/health" -o /tmp/recovery-proxy.json; then
              jq -e '.status == "online" and .service == "ANCLINE API"' /tmp/recovery-proxy.json >/dev/null
              echo "status=PASS" >> "$GITHUB_OUTPUT"
              echo "Render API automatic rollback + runtime recovery PASS"
              exit 0
            fi
            [[ "$i" == "60" ]] && {
              echo "Render API rollback was requested but approved runtime did not converge.";
              exit 1;
            }
            sleep 10
          done

      - name: Write failure recovery evidence
        if: always()
        env:
          RECOVERY_STATUS: ${{ steps.verify.outputs.status }}
          BASE_WEB_DIGEST: ${{ needs.baseline.outputs.web_digest }}
          BASE_API_DIGEST: ${{ needs.baseline.outputs.api_digest }}
          BASE_WEB_COMMIT: ${{ needs.baseline.outputs.web_commit }}
          BASE_API_COMMIT: ${{ needs.baseline.outputs.api_commit }}
        run: |
          python - <<'PY'
          import json, os
          evidence={
            "schema":"ANCLINE_FAILURE_RECOVERY_EVIDENCE_V2",
            "failedReleaseCommit":os.environ["GITHUB_SHA"],
            "runId":os.environ["GITHUB_RUN_ID"],
            "baseline":{
              "webDigest":os.getenv("BASE_WEB_DIGEST"),
              "apiDigest":os.getenv("BASE_API_DIGEST"),
              "webCommit":os.getenv("BASE_WEB_COMMIT"),
              "apiCommit":os.getenv("BASE_API_COMMIT")
            },
            "recoveryStatus":os.getenv("RECOVERY_STATUS") or "FAIL",
            "method":"Render API exact immutable image deployment",
            "note":"Candidate promotion and recovery use authenticated Render API deployment of exact immutable image tags."
          }
          open("ANCLINE_FAILURE_RECOVERY_EVIDENCE.json","w").write(json.dumps(evidence,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ancline-failure-recovery-evidence-${{ github.sha }}
          path: ANCLINE_FAILURE_RECOVERY_EVIDENCE.json
          retention-days: 90

  evidence:
    needs: [changes, baseline, quality, build-web, build-api, promote, remote-gate, finalize, recovery]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Create hardened release evidence
        env:
          WEB_CHANGED: ${{ needs.changes.outputs.web }}
          API_CHANGED: ${{ needs.changes.outputs.api }}
          SHARED_CHANGED: ${{ needs.changes.outputs.shared }}
          BASE_WEB_DIGEST: ${{ needs.baseline.outputs.web_digest }}
          BASE_API_DIGEST: ${{ needs.baseline.outputs.api_digest }}
          WEB_DIGEST: ${{ needs.build-web.outputs.digest }}
          API_DIGEST: ${{ needs.build-api.outputs.digest }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          PROMOTION_RESULT: ${{ needs.promote.result }}
          REMOTE_GATE_RESULT: ${{ needs.remote-gate.result }}
          FINALIZE_RESULT: ${{ needs.finalize.result }}
          RECOVERY_RESULT: ${{ needs.recovery.result }}
          DEPLOYED_API_COMMIT: ${{ needs.remote-gate.outputs.api_commit }}
          DEPLOYED_WEB_COMMIT: ${{ needs.remote-gate.outputs.web_commit }}
          UAT_STATUS: ${{ needs.remote-gate.outputs.uat_status }}
          UAT_RUN_ID: ${{ needs.remote-gate.outputs.uat_run_id }}
          BACKUP_STATUS: ${{ needs.remote-gate.outputs.backup_status }}
          BACKUP_SHA256: ${{ needs.remote-gate.outputs.backup_sha256 }}
          BACKUP_ARTIFACT_SHA256: ${{ needs.remote-gate.outputs.backup_artifact_sha256 }}
          REGISTRY_SHA256: ${{ needs.finalize.outputs.registry_sha256 }}
          DRILL_TRIGGERED: ${{ needs.remote-gate.outputs.drill_triggered }}
        run: |
          python - <<'PY'
          import json, os
          remote=os.getenv("REMOTE_GATE_RESULT")
          drill=os.getenv("DRILL_TRIGGERED")=="true"
          recovery=os.getenv("RECOVERY_RESULT")
          finalize=os.getenv("FINALIZE_RESULT")
          drill_passed=drill and remote=="success" and recovery=="success" and finalize=="skipped"
          evidence={
            "schema":"ANCLINE_SMART_RELEASE_EVIDENCE_V2",
            "commit":os.environ["GITHUB_SHA"],
            "runId":os.environ["GITHUB_RUN_ID"],
            "components":{
              "webChanged":os.getenv("WEB_CHANGED")=="true",
              "apiChanged":os.getenv("API_CHANGED")=="true",
              "sharedChanged":os.getenv("SHARED_CHANGED")=="true"
            },
            "baseline":{"webDigest":os.getenv("BASE_WEB_DIGEST"),"apiDigest":os.getenv("BASE_API_DIGEST")},
            "candidate":{"webDigest":os.getenv("WEB_DIGEST") or None,"apiDigest":os.getenv("API_DIGEST") or None},
            "runtime":{
              "webCommit":os.getenv("DEPLOYED_WEB_COMMIT") or None,
              "apiCommit":os.getenv("DEPLOYED_API_COMMIT") or None,
              "uatStatus":os.getenv("UAT_STATUS") or None,
              "uatRunId":os.getenv("UAT_RUN_ID") or None,
              "backupStatus":os.getenv("BACKUP_STATUS") or None,
              "backupCiphertextSha256":os.getenv("BACKUP_SHA256") or None,
              "offPlatformArtifactSha256":os.getenv("BACKUP_ARTIFACT_SHA256") or None
            },
            "approvedRegistrySha256":os.getenv("REGISTRY_SHA256") or None,
            "results":{
              "quality":os.getenv("QUALITY_RESULT"),
              "promotion":os.getenv("PROMOTION_RESULT"),
              "remoteGate":remote,
              "finalize":os.getenv("FINALIZE_RESULT"),
              "automaticRecovery":recovery
            },
            "drill":{
              "triggered":drill,
              "passed":drill_passed
            },
            "approved":((os.getenv("WEB_CHANGED")!="true" and os.getenv("API_CHANGED")!="true" and os.getenv("QUALITY_RESULT")=="success") or ((not drill) and remote=="success" and finalize=="success")),
            "rollbackRequired":(remote=="failure" or drill) and (os.getenv("WEB_CHANGED")=="true" or os.getenv("API_CHANGED")=="true"),
            "boundary":"Free staging release evidence; not final production authorization."
          }
          open("ANCLINE_SMART_RELEASE_EVIDENCE_V2.json","w").write(json.dumps(evidence,indent=2)+"\n")
          print(json.dumps(evidence,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ancline-smart-release-evidence-v2-${{ github.sha }}
          path: ANCLINE_SMART_RELEASE_EVIDENCE_V2.json
          retention-days: 90
      - name: Enforce release or rollback-drill outcome
        env:
          WEB_CHANGED: ${{ needs.changes.outputs.web }}
          API_CHANGED: ${{ needs.changes.outputs.api }}
          DRILL_TRIGGERED: ${{ needs.remote-gate.outputs.drill_triggered }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          PROMOTION_RESULT: ${{ needs.promote.result }}
          REMOTE_GATE_RESULT: ${{ needs.remote-gate.result }}
          FINALIZE_RESULT: ${{ needs.finalize.result }}
          RECOVERY_RESULT: ${{ needs.recovery.result }}
        run: |
          set -euo pipefail
          [[ "$QUALITY_RESULT" == "success" ]] || exit 1

          if [[ "$WEB_CHANGED" != "true" && "$API_CHANGED" != "true" ]]; then
            [[ "$PROMOTION_RESULT" == "skipped" ]] || exit 1
            [[ "$REMOTE_GATE_RESULT" == "skipped" ]] || exit 1
            [[ "$FINALIZE_RESULT" == "skipped" ]] || exit 1
            echo "No runtime component changed; deployment/finalize gates correctly skipped."
            echo "No-runtime Smart Release control PASS"
            exit 0
          fi

          [[ "$PROMOTION_RESULT" == "success" ]] || exit 1

          if [[ "$DRILL_TRIGGERED" == "true" ]]; then
            [[ "$REMOTE_GATE_RESULT" == "success" ]] || exit 1
            [[ "$FINALIZE_RESULT" == "skipped" ]] || exit 1
            [[ "$RECOVERY_RESULT" == "success" ]] || exit 1
            echo "Validated full auto-rollback drill PASS"
            exit 0
          fi

          [[ "$REMOTE_GATE_RESULT" == "success" ]] || exit 1
          [[ "$FINALIZE_RESULT" == "success" ]] || exit 1

# render-api-drill-trigger: final-green-drill

# final-hardening-drill-trigger: 2026-09-22-final-resilience-dr-proof
