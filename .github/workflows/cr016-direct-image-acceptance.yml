name: CR-016 Direct Image Deploy + Live Acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cr016-direct-image-acceptance.yml'

permissions:
  contents: read

env:
  TARGET_SHA: 338edc48dd2732d6d23502cbf4b9ecd8760accc5
  IMAGE_URL: ghcr.io/cfi21/ancline-web:sha-338edc48dd2732d6d23502cbf4b9ecd8760accc5
  STAGING_WEB_URL: https://ancline-web-staging.onrender.com
  API_URL: https://ancline-api-staging.onrender.com
  RENDER_WEB_SERVICE_ID: srv-dairuloae00c73fnfo1g
  RENDER_WORKSPACE_ID: tea-daiog6tg1s2s7385f4h0

jobs:
  deploy-live-accept:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Directly switch staging Web source to immutable GHCR image
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          update_code="$(curl -sS -o /tmp/service-update.json -w '%{http_code}' \
            -X PATCH "https://api.render.com/v1/services/$RENDER_WEB_SERVICE_ID" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            --data "$(jq -nc --arg owner "$RENDER_WORKSPACE_ID" --arg image "$IMAGE_URL" \
              '{image:{ownerId:$owner,imagePath:$image},autoDeploy:"no"}')")"
          [[ "$update_code" == "200" ]] || { cat /tmp/service-update.json; exit 1; }
          jq -e --arg image "$IMAGE_URL" '.imagePath == $image' /tmp/service-update.json >/dev/null

      - name: Deploy immutable CR-016 image
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          deploy_code="$(curl -sS -o /tmp/deploy.json -w '%{http_code}' \
            -X POST "https://api.render.com/v1/services/$RENDER_WEB_SERVICE_ID/deploys" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            --data "$(jq -nc --arg image "$IMAGE_URL" '{imageUrl:$image}')")"
          [[ "$deploy_code" == "201" || "$deploy_code" == "202" ]] || { cat /tmp/deploy.json; exit 1; }
          DEPLOY_ID="$(jq -r '.id' /tmp/deploy.json)"
          for i in $(seq 1 90); do
            curl -sS -H "Accept: application/json" -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_WEB_SERVICE_ID/deploys/$DEPLOY_ID" -o /tmp/status.json
            status="$(jq -r '.status' /tmp/status.json)"
            echo "deploy status: $status"
            [[ "$status" == "live" ]] && exit 0
            if [[ "$status" =~ ^(build_failed|update_failed|canceled|deactivated)$ ]]; then
              cat /tmp/status.json; exit 1
            fi
            sleep 10
          done
          exit 1

      - name: Verify exact live CR-016 identity and API health
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            code="$(curl -L -sS -o /tmp/release.json -w '%{http_code}' --connect-timeout 10 --max-time 25 "$STAGING_WEB_URL/release-info" || true)"
            if [[ "$code" == "200" ]] && jq -e --arg sha "$TARGET_SHA" '.buildCommit == $sha' /tmp/release.json >/dev/null; then
              curl -L -fsS "$STAGING_WEB_URL/api-proxy/health" >/tmp/proxy-health.json
              cat /tmp/release.json
              cat /tmp/proxy-health.json
              exit 0
            fi
            sleep 10
          done
          cat /tmp/release.json 2>/dev/null || true
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install live acceptance browser
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium

      - name: Final live CR-016 UI hardening
        env:
          WEB_URL: https://ancline-web-staging.onrender.com
        run: node tools/live_ui_hardening.mjs

      - name: Final live login jobs and role regression
        env:
          WEB_URL: https://ancline-web-staging.onrender.com
          EXPECTED_API_COMMIT: 04b6957860c7bb47576d76f1d6fe1b90dca81f9b
        run: node tools/live_ui_final_acceptance.mjs

      - name: Upload final CR-016 live acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cr016-direct-live-acceptance-${{ github.run_id }}
          path: |
            ui-hardening-artifacts/
            ui-acceptance-artifacts/
          retention-days: 30
