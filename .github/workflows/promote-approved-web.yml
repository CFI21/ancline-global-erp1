name: ANCLINE Promote Approved Web

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-approved-web.yml'

permissions:
  contents: read
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and promote approved Web image
        shell: bash
        run: |
          set -euo pipefail
          tag="ghcr.io/cfi21/ancline-web:sha-10e07abb5291c014ae8eff7c8db4e338957f01f9"
          expected="sha256:3aa3d7f6eebc20b606f4f6aa176049adf9b662b8fbb1f44e469c4c783d338c65"
          docker buildx imagetools inspect "$tag" >/tmp/approved-web.txt
          actual="$(awk '/^Digest:/ {print $2; exit}' /tmp/approved-web.txt)"
          [[ "$actual" == "$expected" ]] || { echo "Approved Web digest mismatch: $actual"; exit 1; }
          docker buildx imagetools create --tag ghcr.io/cfi21/ancline-web:latest "$tag"
          docker buildx imagetools inspect ghcr.io/cfi21/ancline-web:latest >/tmp/latest-web.txt
          latest="$(awk '/^Digest:/ {print $2; exit}' /tmp/latest-web.txt)"
          [[ "$latest" == "$expected" ]] || { echo "Latest promotion mismatch: $latest"; exit 1; }
          printf '{"approvedCommit":"10e07abb5291c014ae8eff7c8db4e338957f01f9","digest":"%s","status":"PASS"}\n' "$latest" > ANCLINE_APPROVED_WEB_PROMOTION.json
      - uses: actions/upload-artifact@v4
        with:
          name: ancline-approved-web-promotion
          path: ANCLINE_APPROVED_WEB_PROMOTION.json
          retention-days: 30
