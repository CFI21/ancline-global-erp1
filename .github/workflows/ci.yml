name: ANCLINE Build Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ancline-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run test:ci -w apps/api
      - run: npm run build -w apps/api
      - name: Reject legacy page sidebars
        run: |
          if grep -RIl --include='page.tsx' '<aside className="side"' apps/web/app; then
            echo "Legacy page-specific sidebar found. Use WorkspaceShell instead."
            exit 1
          fi
      - run: npm run build -w apps/web
