name: ANCLINE Production Go-Live Final Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-go-live-final.yml'
      - 'tools/live_go_live_final_acceptance.mjs'
      - 'infra/go-live/**'

permissions:
  contents: read

jobs:
  final-production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEB_URL: https://ancline-web-prod.onrender.com
      API_URL: https://ancline-api-prod.onrender.com
      EXPECTED_WEB_COMMIT: 5cf743afbeb2ab10b386b9f2ef53b94aa6fbdc31
      EXPECTED_API_COMMIT: f57462950fe1f8c6420806a25436a4685dc7f54d
      EXPECTED_WEB_DIGEST: sha256:ea3ae4c6ea4e3e93a108cd94ab88d6494d139b054308731916c0d2a24313dbed
      EXPECTED_API_DIGEST: sha256:c7a55b4cb1347703313899566782b7a745f91843d6396eee2f9ed2a6ba31bc3b
    steps:
      - uses: actions/checkout@v4
      - name: Run production final acceptance
        env:
          GO_LIVE_TEST_BEARER: ${{ secrets.GO_LIVE_TEST_BEARER }}
        run: node tools/live_go_live_final_acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ancline-production-go-live-final-${{ github.sha }}
          path: ANCLINE_GO_LIVE_FINAL_ACCEPTANCE.json
          retention-days: 90
      - name: Enforce production sign-off
        run: |
          set -euo pipefail
          test -f ANCLINE_GO_LIVE_FINAL_ACCEPTANCE.json
          jq -e '.status=="PASS" and .signoff.decision=="GO_LIVE_APPROVED" and (.blockers|length)==0' ANCLINE_GO_LIVE_FINAL_ACCEPTANCE.json >/dev/null
          echo "ANCLINE PRODUCTION GO-LIVE FINAL SIGN-OFF: PASS"
