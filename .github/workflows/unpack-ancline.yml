name: Inspect ANCLINE ERP Archive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect archive without modifying repository
        run: |
          test -f ANCLINE_GLOBAL_ERP1_GitHub_Upload_Ready.zip
          unzip -t ANCLINE_GLOBAL_ERP1_GitHub_Upload_Ready.zip
          echo "Archive is valid. No files were extracted or committed."
