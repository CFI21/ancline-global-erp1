name: Unpack ANCLINE ERP Project

on:
  push:
    paths:
      - '.github/workflows/unpack-ancline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract ANCLINE ERP archive
        run: |
          unzip -o ANCLINE_GLOBAL_ERP1_GitHub_Upload_Ready.zip -d .
          rm -f .github/workflows/ci.yml

      - name: Commit extracted project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
          else
            git commit -m "Extract ANCLINE ERP project files"
            git push origin HEAD:main
          fi
